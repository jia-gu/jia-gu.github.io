<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>

{% capture document_title %}{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.name }}{% endif %}{% endcapture %}
{% capture document_description %}{{ page.excerpt | default: site.description | strip_html | strip_newlines }}{% endcapture %}
<title>{{ document_title | strip }}</title>
<meta name="description" content="{{ document_description | strip | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ document_title | strip | escape }}">
<meta property="og:description" content="{{ document_description | strip | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
